<!doctype html>
<!-- Cascade art style mockup J-StudioSet. Standalone: open in any browser. Rendered to ../img/J-StudioSet.png -->
<html lang="en"><head><meta charset="utf-8"><title>Studio Set</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c9a227}a:hover{color:#fff}
</style>
</head>
<body><template id="t">
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 56px; display: flex; gap: 52px; align-items: center; overflow: hidden; background: radial-gradient(ellipse 60% 70% at 62% 30%, #4a3a30, #1d1613 70%, #0e0a09); font-family: 'Patrick Hand', sans-serif; color: #efe6d6">
  <div style="width: 320px; display: flex; flex-direction: column; gap: 22px">
    <div style="font-family: 'Patrick Hand SC', sans-serif; font-size: 60px; line-height: 1; color: #c9a227; transform: rotate(-2deg); text-shadow: 0 4px 0 #6e5410, 0 10px 16px rgba(0,0,0,0.7)">Cascade</div>
    <div style="font-size: 22px; color: #b8a890; transform: rotate(-1deg)">Level 24 · Night Shoot</div>
    <div style="background: #2b2f2e; border-radius: 10px 14px 9px 12px; padding: 18px 22px; border: 10px solid #6b4a2e; transform: rotate(1deg); box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 12px 0 #3a2616, 0 24px 30px rgba(0,0,0,0.6)">
      <div style="font-size: 16px; letter-spacing: 3px; color: #b8a890">GOALS</div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 28px"><div style="width: 34px; height: 34px; border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; background: #a3492d; transform: rotate(8deg); box-shadow: inset 4px 4px 6px rgba(255,200,160,0.4), inset -5px -6px 8px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.6)"></div>18 / 30</div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 28px"><div style="width: 34px; height: 34px; border-radius: 52% 48% 55% 45% / 45% 55% 45% 55%; background: rgba(235,235,225,0.85); transform: rotate(-6deg); box-shadow: inset 3px 3px 6px #fff, inset -4px -5px 8px rgba(80,90,90,0.5), 0 4px 6px rgba(0,0,0,0.6)"></div>3 / 6 ice</div>
    </div>
    <div style="display: flex; gap: 16px">
      <div style="flex-grow: 1; background: #c9a227; border-radius: 40% 60% 50% 50% / 30px 34px 28px 32px; padding: 12px 20px; transform: rotate(-1.5deg); box-shadow: inset 4px 4px 8px rgba(255,240,180,0.5), inset -6px -8px 12px rgba(0,0,0,0.35), 0 10px 0 #6e5410, 0 20px 26px rgba(0,0,0,0.6)"><div style="font-size: 16px; letter-spacing: 3px; color: #4a3708">MOVES</div><div style="font-size: 54px; line-height: 1; color: #2a1f05">12</div></div>
      <div style="flex-grow: 1; background: #5e3a5a; border-radius: 55% 45% 50% 50% / 32px 28px 34px 30px; padding: 12px 20px; transform: rotate(1deg); box-shadow: inset 4px 4px 8px rgba(255,220,240,0.3), inset -6px -8px 12px rgba(0,0,0,0.4), 0 10px 0 #2e1a2c"><div style="font-size: 16px; letter-spacing: 3px; color: #d9b8d4">SCORE</div><div style="font-size: 34px; line-height: 1.6">8,450</div></div>
    </div>
    <div style="display: flex; gap: 14px">
      <button type="button" style="font: inherit; font-size: 24px; padding: 8px 28px; border: 0; border-radius: 48% 52% 50% 50% / 24px 22px 26px 24px; background: #3f7a78; color: #efe6d6; transform: rotate(-1deg); box-shadow: inset 3px 3px 6px rgba(200,240,235,0.4), inset -4px -5px 8px rgba(0,0,0,0.4), 0 7px 0 #1f3d3c, 0 14px 18px rgba(0,0,0,0.6)">Pause</button>
      <button type="button" style="font: inherit; font-size: 24px; padding: 8px 28px; border: 0; border-radius: 52% 48% 50% 50% / 22px 26px 22px 26px; background: #7a7a3a; color: #efe6d6; transform: rotate(1.5deg); box-shadow: inset 3px 3px 6px rgba(230,230,180,0.4), inset -4px -5px 8px rgba(0,0,0,0.4), 0 7px 0 #3d3d1c, 0 14px 18px rgba(0,0,0,0.6)">Hint</button>
    </div>
  </div>
  <div style="padding: 26px; border-radius: 8px 12px 7px 10px; background: repeating-linear-gradient(94deg, #a87d4f 0 7px, #9c7146 7px 9px, #b0865a 9px 19px, #a07548 19px 21px); transform: rotate(0.4deg); box-shadow: inset 0 0 0 4px rgba(0,0,0,0.15), inset 0 20px 40px rgba(0,0,0,0.25), 0 18px 0 #5a3d22, 0 20px 0 6px rgba(0,0,0,0.3), 0 50px 70px rgba(0,0,0,0.8); display: grid; grid-template-columns: repeat(8, 72px); gap: 6px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
      <div style="{{c.cell}}">
        <div style="{{c.tile}}"></div>
        <div style="{{c.dent}}"></div>
        <sc-if value="{{c.line}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 12px; right: 10px; top: 30px; height: 12px; border-radius: 8px 6px 9px 5px; background: #efe6d6; transform: rotate(-3deg); box-shadow: inset 2px 2px 3px #fff, inset -2px -3px 4px rgba(0,0,0,0.3), 0 3px 4px rgba(0,0,0,0.6)"></div></sc-if>
        <sc-if value="{{c.bomb}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 20px; border-radius: 52% 48% 50% 50% / 48% 52% 48% 52%; background: radial-gradient(circle at 35% 30%, #4a4a4a, #0d0d0d 65%); box-shadow: 0 5px 8px rgba(0,0,0,0.8)"></div><div style="position: absolute; left: 44px; top: 14px; width: 6px; height: 14px; border-radius: 3px; background: #c9a227; transform: rotate(25deg)"></div></sc-if>
        <sc-if value="{{c.ice}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: -2px; border-radius: 46% 54% 50% 50% / 52% 48% 54% 46%; background: rgba(235,235,225,0.75); transform: rotate(4deg); box-shadow: inset 5px 5px 10px #fff, inset -5px -7px 12px rgba(80,90,90,0.6), 0 6px 10px rgba(0,0,0,0.6)"></div><div style="position: absolute; left: 18px; top: 22px; width: 36px; height: 3px; background: rgba(100,110,110,0.6); transform: rotate(-28deg)"></div></sc-if>
        <sc-if value="{{c.chain}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; inset: 1px; border-radius: 50% 48% 52% 50% / 48% 52% 48% 52%; border: 8px dashed #1d1613; transform: rotate(-7deg); box-shadow: 0 3px 4px rgba(0,0,0,0.6)"></div></sc-if>
      </div>
    </sc-for>
  </div>
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: 0.35" aria-hidden="true">
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="100%" height="100%" filter="url(#grain2)"></rect>
  </svg>
</div>
</template>
<script>class DCLogic{}
class Component extends DCLogic {
  renderVals() {
    // Dim studio key light from the upper right: hard shadows down-left. [body, rim light]
    const P = [['#a3492d','#e08a66'],['#c9a227','#f2d978'],['#7a7a3a','#b9b96e'],['#3f7a78','#8fc4c0'],['#5e3a5a','#b082aa']];
    const cells = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const id = r * 8 + c, k = (r * 3 + c * 2 + ((r * c) % 3)) % 5, p = P[k], sel = id === 27;
      const s = (id * 7919) % 97;
      const rot = ((s % 13) - 6) * 1.3;
      const a = 40 + (s % 11), b = 100 - a, d = 42 + ((s * 3) % 13), e = 100 - d;
      const bright = 0.9 + ((s % 7) / 7) * 0.18;
      const dx = 16 + (s % 26), dy = 18 + ((s * 5) % 24);
      cells.push({
        cell: `position: relative; width: 72px; height: 72px; border-radius: 48% 52% 46% 54% / 50% 46% 54% 50%; background: rgba(0,0,0,0.3); box-shadow: inset 2px 3px 6px rgba(0,0,0,0.6)`,
        tile: `position: absolute; inset: 4px; border-radius: ${a}% ${b}% ${d}% ${e}% / ${e}% ${d}% ${b}% ${a}%; background: ${p[0]}; filter: brightness(${bright.toFixed(2)}); transform: rotate(${rot}deg)${sel ? ' translateY(-10px) scale(1.08)' : ''}; box-shadow: inset -4px -4px 6px ${p[1]}66, inset 6px 8px 12px rgba(0,0,0,0.45), inset 0 0 0 1px ${p[1]}33, -6px ${sel ? 18 : 9}px ${sel ? 16 : 8}px rgba(0,0,0,0.65)${sel ? ', 0 0 0 4px #efe6d6' : ''}`,
        dent: `position: absolute; left: ${dx}px; top: ${dy}px; width: 22px; height: 18px; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, rgba(0,0,0,0.3), rgba(0,0,0,0) 70%); transform: rotate(${rot * 3}deg)`,
        line: id === 19, bomb: id === 44, ice: [9, 10, 53, 54].includes(id), chain: [30, 37].includes(id)
      });
    }
    return { cells };
  }
}


const tpl=document.getElementById('t').innerHTML;
const {cells}=new Component().renderVals();
const html=tpl.replace(/<sc-for[^>]*>([\s\S]*?)<\/sc-for>/,(m,body)=>cells.map(c=>
  body.replace(/<sc-if value="\{\{c\.(\w+)\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g,(m2,k,b)=>c[k]?b:'')
      .replace(/\{\{c\.(\w+)\}\}/g,(m3,k)=>c[k])).join(''));
document.body.innerHTML=html;
</script></body></html>
