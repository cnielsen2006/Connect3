<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#efe8db">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The game fills the whole window (and the whole screen on a phone); the colors are the K: Pebbles page background. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
                   background: linear-gradient(#efe8db, #dfd4c1); font-family: sans-serif; color: #4f4a46; }
      body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
             -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
                      touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; pointer-events: none; }
      #loading .name { font-size: 40px; letter-spacing: 2px; color: #b98468; }
      #loading .bar { width: min(60vw, 320px); height: 10px; border-radius: 5px; background: #cbbfa8; overflow: hidden; }
      #loading .bar > div { width: 0%; height: 100%; background: #8fa08a; }
      #loading .note { font-size: 14px; opacity: 0.7; }
      #banner { position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px; font-size: 14px; display: none; z-index: 2; }
      #banner div { margin-bottom: 4px; padding: 8px 10px; border-radius: 6px; background: #f6f1e6; }
      #banner div.error { background: #b98468; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    <div id="loading">
      <div class="name">{{{ PRODUCT_NAME }}}</div>
      <div class="bar"><div id="progress"></div></div>
      <div class="note" id="note">Loading...</div>
    </div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var banner = document.querySelector("#banner");

      // Errors stay on screen; warnings disappear after a few seconds.
      function showBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.className = "error";
        banner.appendChild(div);
        banner.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            banner.removeChild(div);
            if (!banner.children.length) banner.style.display = "none";
          }, 5000);
        }
      }

      // No browser menu on right-click: the right mouse button pans the board.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var buildUrl = "Build";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Saves and settings live in Application.persistentDataPath: mirror every write to IndexedDB so they survive a reload
        // (TRD 13.12). The origin (host and port) owns the data, so localhost and a LAN address have separate saves.
        autoSyncPersistentDataPath: true,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        var loading = document.querySelector("#loading");
        var progress = document.querySelector("#progress");
        var note = document.querySelector("#note");
        createUnityInstance(canvas, config, function (p) {
          progress.style.width = (100 * p) + "%";
          if (p >= 0.9) note.textContent = "Starting...";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          note.textContent = "The game could not start.";
          showBanner(String(message), "error");
        });
      };
      script.onerror = function () { showBanner("Could not load the game files (" + script.src + ").", "error"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
